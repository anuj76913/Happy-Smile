[project]
name = "happysmile"
version = "0.2.0"
description = "HappySmile lead callback platform - Phase 2: intake, randomisation, event log, staff console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "tzdata>=2024.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["happysmile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
